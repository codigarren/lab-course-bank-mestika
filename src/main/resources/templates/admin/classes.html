<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Classes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">
                <i class="fas fa-cogs me-2"></i>Admin Panel
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/classes">Classes</a>
                <a class="nav-link" href="/admin/purchases">Purchases</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <h2>Manage Classes</h2>
                <p class="text-muted">View and manage all learning classes</p>
            </div>
        </div>

        <div class="row">
            <div th:each="class : ${classes}" class="col-md-4 mb-4">
                <div class="card h-100">
                    <img th:src="${class.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${class.name}"></h5>
                        <p class="card-text" th:text="${class.description}"></p>
                        <div class="mt-auto">
                            <p class="text-muted mb-1">
                                <i class="fas fa-user"></i> <span th:text="${class.instructor}"></span>
                            </p>
                            <p class="text-muted mb-1">
                                <i class="fas fa-clock"></i> <span th:text="${class.duration}"></span>
                            </p>
                            <p class="text-success fw-bold">
                                <i class="fas fa-money-bill-wave"></i>
                                Rp <span th:text="${#numbers.formatDecimal(class.price, 0, 'COMMA', 0, 'POINT')}"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
