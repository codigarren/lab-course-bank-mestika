<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Purchases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">
                <i class="fas fa-cogs me-2"></i>Admin Panel
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/classes">Classes</a>
                <a class="nav-link" href="/admin/purchases">Purchases</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <h2>Manage Purchases</h2>
                <p class="text-muted">View and manage all student purchases</p>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Student</th>
                                        <th>Email</th>
                                        <th>Class</th>
                                        <th>Price</th>
                                        <th>Status</th>
                                        <th>Purchase Date</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="purchase : ${purchases}">
                                        <td th:text="${purchase.id}"></td>
                                        <td th:text="${purchase.user?.fullName}"></td>
                                        <td th:text="${purchase.user?.email}"></td>
                                        <td th:text="${purchase.learningClass?.name}"></td>
                                        <td>Rp <span th:text="${#numbers.formatDecimal(purchase.price, 0, 'COMMA', 0, 'POINT')}"></span></td>
                                        <td>
                                            <span th:class="${purchase.status == T(com.example.learningapp.model.Purchase.Status).CONFIRMED ? 'badge bg-success' : purchase.status == T(com.example.learningapp.model.Purchase.Status).REJECTED ? 'badge bg-danger' : 'badge bg-warning'}" 
                                                  th:text="${purchase.status}"></span>
                                        </td>
                                        <td th:text="${#temporals.format(purchase.purchaseDate, 'dd-MM-yyyy HH:mm')}"></td>
                                        <td>
                                            <a th:href="@{/admin/purchase/{id}(id=${purchase.id})}" class="btn btn-sm btn-primary">
                                                <i class="fas fa-eye"></i> View
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
