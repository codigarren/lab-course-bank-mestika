<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/member/dashboard">
                <i class="fas fa-graduation-cap me-2"></i>Learning Platform
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/member/classes">Classes</a>
                <a class="nav-link" href="/member/profile">Profile</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <h2>Welcome, <span th:text="${session.fullName}"></span>!</h2>
                <p class="text-muted">Manage your learning journey</p>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5>Total Classes</h5>
                                <h3 th:text="${#lists.size(classes)}"></h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-book fa-3x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5>My Purchases</h5>
                                <h3 th:text="${#lists.size(purchases)}"></h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-shopping-cart fa-3x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <h3>Available Classes</h3>
                <div class="row">
                    <div th:each="class : ${classes}" class="col-md-4 mb-4">
                        <div class="card">
                            <img th:src="${class.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${class.name}"></h5>
                                <p class="card-text" th:text="${class.description}"></p>
                                <p class="text-success fw-bold">
                                    <i class="fas fa-money-bill-wave"></i>
                                    Rp <span th:text="${#numbers.formatDecimal(class.price, 0, 'COMMA', 0, 'POINT')}"></span>
                                </p>
                                <a th:href="@{/member/class/{id}(id=${class.id})}" class="btn btn-primary">View Details</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <h3>My Purchases</h3>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Class</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Purchase Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="purchase : ${purchases}">
                                <td th:text="${purchase.learningClass?.name}"></td>
                                <td>Rp <span th:text="${#numbers.formatDecimal(purchase.price, 0, 'COMMA', 0, 'POINT')}"></span></td>
                                <td>
                                    <span th:class="${purchase.status == T(com.example.learningapp.model.Purchase.Status).CONFIRMED ? 'badge bg-success' : purchase.status == T(com.example.learningapp.model.Purchase.Status).REJECTED ? 'badge bg-danger' : 'badge bg-warning'}" 
                                          th:text="${purchase.status}"></span>
                                </td>
                                <td th:text="${#temporals.format(purchase.purchaseDate, 'dd-MM-yyyy HH:mm')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
