<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${material.name}">Material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/member/dashboard">
                <i class="fas fa-graduation-cap me-2"></i>Learning Platform
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/member/classes">Classes</a>
                <a class="nav-link" href="/member/profile">Profile</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/member/classes">Classes</a></li>
                <li class="breadcrumb-item"><a th:href="@{/member/class/{id}(id=${class.id})}" th:text="${class.name}"></a></li>
                <li class="breadcrumb-item" th:text="${module.name}"></li>
                <li class="breadcrumb-item active" th:text="${material.name}"></li>
            </ol>
        </nav>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="${material.name}"></h3>
                        <p class="text-muted mb-0">
                            Module: <span th:text="${module.name}"></span> | 
                            Class: <span th:text="${class.name}"></span>
                        </p>
                    </div>
                    <div class="card-body">
                        <!-- Video Content -->
                        <div th:if="${material.videoUrl}" class="mb-4">
                            <div class="ratio ratio-16x9">
                                <iframe th:src="${material.videoUrl}" allowfullscreen></iframe>
                            </div>
                        </div>

                        <!-- Text Content -->
                        <div th:if="${material.content}" class="mb-4">
                            <!-- Vulnerable to XSS -->
                            <!-- <div th:utext="${material.content}"></div> -->
                            <div th:text="${material.content}"></div>
                        </div>

                        <!-- File Download -->
                        <div th:if="${material.fileUrl}" class="mb-4">
                            <a th:href="${material.fileUrl}" class="btn btn-outline-primary" target="_blank">
                                <i class="fas fa-download"></i> Download Material
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Navigation</h5>
                    </div>
                    <div class="card-body">
                        <a th:href="@{/member/class/{id}(id=${class.id})}" class="btn btn-outline-primary w-100 mb-2">
                            <i class="fas fa-arrow-left"></i> Back to Class
                        </a>
                        <a href="/member/classes" class="btn btn-outline-secondary w-100 mb-2">
                            <i class="fas fa-list"></i> All Classes
                        </a>
                        <a href="/member/dashboard" class="btn btn-outline-secondary w-100">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
