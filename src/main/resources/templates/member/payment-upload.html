<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Payment Proof</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/member/dashboard">
                <i class="fas fa-graduation-cap me-2"></i>Learning Platform
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/member/classes">Classes</a>
                <a class="nav-link" href="/member/profile">Profile</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-upload me-2"></i>Upload Payment Proof</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success" role="alert">
                            <span th:text="${success}"></span>
                        </div>
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <span th:text="${error}"></span>
                        </div>

                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i>
                            <strong>Payment Instructions:</strong>
                            <ul class="mb-0 mt-2">
                                <li>Transfer to Bank BCA: 123-456-789</li>
                                <li>Account Name: Learning Platform</li>
                                <li>Upload your payment receipt/proof</li>
                                <li>We will verify your payment within 24 hours</li>
                            </ul>
                        </div>

                        <form method="post" action="/member/upload-payment" enctype="multipart/form-data">
                            <input type="hidden" name="purchaseId" th:value="${purchaseId}">
                            
                            <div class="mb-3">
                                <label for="file" class="form-label">Payment Proof</label>
                                <input type="file" class="form-control" id="file" name="file" required>
                                <div class="form-text">Upload your payment receipt</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-upload"></i> Upload Payment Proof
                            </button>
                        </form>

                        <div class="mt-3">
                            <a href="/member/dashboard" class="btn btn-outline-secondary w-100">
                                <i class="fas fa-home"></i> Back to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
