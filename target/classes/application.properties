spring.application.name=learning-app

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/learning_app
spring.datasource.username=learning_user
spring.datasource.password=learning_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Server Configuration
server.port=8007
management.server.port=8087

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Disable CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false