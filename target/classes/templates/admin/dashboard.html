<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">
                <i class="fas fa-cogs me-2"></i>Admin Panel
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/classes">Classes</a>
                <a class="nav-link" href="/admin/purchases">Purchases</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <h2>Admin Dashboard</h2>
                <p class="text-muted">Manage your learning platform</p>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5>Total Classes</h5>
                                <h3 th:text="${#lists.size(classes)}"></h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-book fa-3x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5>Total Purchases</h5>
                                <h3 th:text="${#lists.size(purchases)}"></h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-shopping-cart fa-3x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5>Pending</h5>
                                <h3 th:text="${#lists.size(#lists.select(purchases, p -> p.status == T(com.example.learningapp.model.Purchase.Status).PENDING))}"></h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-clock fa-3x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5>Confirmed</h5>
                                <h3 th:text="${#lists.size(#lists.select(purchases, p -> p.status == T(com.example.learningapp.model.Purchase.Status).CONFIRMED))}"></h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-check fa-3x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>Recent Purchases</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Student</th>
                                        <th>Class</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="purchase : ${#lists.sort(purchases, 'purchaseDate')}" th:if="${purchaseStat.index < 10}">
                                        <td th:text="${purchase.user?.fullName}"></td>
                                        <td th:text="${purchase.learningClass?.name}"></td>
                                        <td>
                                            <span th:class="${purchase.status == T(com.example.learningapp.model.Purchase.Status).CONFIRMED ? 'badge bg-success' : purchase.status == T(com.example.learningapp.model.Purchase.Status).REJECTED ? 'badge bg-danger' : 'badge bg-warning'}" 
                                                  th:text="${purchase.status}"></span>
                                        </td>
                                        <td>
                                            <a th:href="@{/admin/purchase/{id}(id=${purchase.id})}" class="btn btn-sm btn-outline-primary">View</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <a href="/admin/purchases" class="btn btn-primary">View All Purchases</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>Available Classes</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Class Name</th>
                                        <th>Instructor</th>
                                        <th>Price</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="class : ${classes}">
                                        <td th:text="${class.name}"></td>
                                        <td th:text="${class.instructor}"></td>
                                        <td>Rp <span th:text="${#numbers.formatDecimal(class.price, 0, 'COMMA', 0, 'POINT')}"></span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <a href="/admin/classes" class="btn btn-primary">Manage Classes</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
