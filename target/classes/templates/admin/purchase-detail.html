<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">
                <i class="fas fa-cogs me-2"></i>Admin Panel
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/classes">Classes</a>
                <a class="nav-link" href="/admin/purchases">Purchases</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <h2>Purchase Detail</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/admin/purchases">Purchases</a></li>
                        <li class="breadcrumb-item active">Purchase #<span th:text="${purchase.id}"></span></li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4>Purchase Information</h4>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-sm-4"><strong>Purchase ID:</strong></div>
                            <div class="col-sm-8" th:text="${purchase.id}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4"><strong>Student Name:</strong></div>
                            <div class="col-sm-8" th:text="${purchase.user?.fullName}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4"><strong>Student Email:</strong></div>
                            <div class="col-sm-8" th:text="${purchase.user?.email}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4"><strong>Class:</strong></div>
                            <div class="col-sm-8" th:text="${purchase.learningClass?.name}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4"><strong>Price:</strong></div>
                            <div class="col-sm-8">Rp <span th:text="${#numbers.formatDecimal(purchase.price, 0, 'COMMA', 0, 'POINT')}"></span></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4"><strong>Status:</strong></div>
                            <div class="col-sm-8">
                                <span th:class="${purchase.status == T(com.example.learningapp.model.Purchase.Status).CONFIRMED ? 'badge bg-success' : purchase.status == T(com.example.learningapp.model.Purchase.Status).REJECTED ? 'badge bg-danger' : 'badge bg-warning'}" 
                                      th:text="${purchase.status}"></span>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4"><strong>Purchase Date:</strong></div>
                            <div class="col-sm-8" th:text="${#temporals.format(purchase.purchaseDate, 'dd-MM-yyyy HH:mm:ss')}"></div>
                        </div>
                        <div th:if="${purchase.confirmedAt}" class="row mb-3">
                            <div class="col-sm-4"><strong>Confirmed At:</strong></div>
                            <div class="col-sm-8" th:text="${#temporals.format(purchase.confirmedAt, 'dd-MM-yyyy HH:mm:ss')}"></div>
                        </div>
                    </div>
                </div>

                <!-- Payment Proof -->
                <div th:if="${purchase.paymentProof}" class="card mt-4">
                    <div class="card-header">
                        <h4>Payment Proof</h4>
                    </div>
                    <div class="card-body">
                        <p><strong>File:</strong> <span th:text="${purchase.paymentProof}"></span></p>
                        <!-- Vulnerable: Direct file access without validation -->
                        <!-- handle di backend -->
                        <a th:href="${purchase.paymentProof}" target="_blank" class="btn btn-outline-primary">
                            <i class="fas fa-download"></i> Download Payment Proof
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Actions</h5>
                    </div>
                    <div class="card-body">
                        <form method="post" action="/admin/purchase/update-status">
                            <input type="hidden" name="purchaseId" th:value="${purchase.id}">
                            
                            <div class="mb-3">
                                <label for="status" class="form-label">Update Status</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="PENDING" th:selected="${purchase.status == T(com.example.learningapp.model.Purchase.Status).PENDING}">Pending</option>
                                    <option value="CONFIRMED" th:selected="${purchase.status == T(com.example.learningapp.model.Purchase.Status).CONFIRMED}">Confirmed</option>
                                    <option value="REJECTED" th:selected="${purchase.status == T(com.example.learningapp.model.Purchase.Status).REJECTED}">Rejected</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-2">
                                <i class="fas fa-save"></i> Update Status
                            </button>
                        </form>
                        
                        <a href="/admin/purchases" class="btn btn-outline-secondary w-100">
                            <i class="fas fa-arrow-left"></i> Back to Purchases
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
